site_name: TurtleBot3 Lime × Isaac Sim
site_description: Beginner tutorials for NVIDIA Isaac Sim 6.2 and ROS 2 Jazzy, using the TurtleBot3 Lime mobile manipulator.
site_url: https://an-robotics.github.io/turtlebot3-lime-isaac-sim/
repo_url: https://github.com/an-robotics/turtlebot3-lime-isaac-sim
repo_name: an-robotics/turtlebot3-lime-isaac-sim
edit_uri: edit/main/docs/
copyright: Apache-2.0 · TurtleBot3 Lime packages © ROBOTIS (Apache-2.0)

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Getting Started:
      - Setup: tutorials/00-setup.md
      - Isaac Sim basics & Hello World: tutorials/01-hello-world.md
  - Robot Setup:
      - Import TurtleBot3 Lime: tutorials/02-import-urdf.md
      - Tune the robot: tutorials/03-tune-robot.md
      - Move it from Python: tutorials/04-hello-robot.md
  - OmniGraph:
      - Your first Action Graph: tutorials/05-action-graph.md
  - ROS 2:
      - Drive with /cmd_vel: tutorials/06-ros2-drive.md
      - Odometry, TF & RViz: tutorials/07-odom-tf.md
      - Camera (RealSense D435): tutorials/08-camera.md
      - LiDAR & IMU: tutorials/09-lidar-imu.md
  - Applications:
      - Object detection with YOLO: tutorials/10-yolo.md
      - Navigation with Nav2: tutorials/11-nav2.md
      - Arm control with MoveIt 2: tutorials/12-moveit2.md
      - Pick and place: tutorials/13-all-together.md
      - Make your own map with SLAM: tutorials/14-slam.md
      - Behavior trees: tutorials/15-behavior-trees.md
      - "All together: tidy the room": tutorials/16-tidy-room.md
  - Reference:
      - Troubleshooting: reference/troubleshooting.md
      - Credits & license: reference/credits.md

# Japanese version: docs/**/<page>.ja.md next to each English page, published under /ja/.
# A page without a .ja.md falls back to English in the Japanese site.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          site_description: TurtleBot3 Lime モバイルマニピュレーターで学ぶ、NVIDIA Isaac Sim 6.2 と ROS 2 Jazzy の入門チュートリアル。
          copyright: Apache-2.0 · TurtleBot3 Lime パッケージ © ROBOTIS (Apache-2.0)
          theme:
            palette:
              - toggle:
                  name: ダークモードに切り替え
              - toggle:
                  name: ライトモードに切り替え
          nav_translations:
            Home: ホーム
            Getting Started: はじめに
            Setup: セットアップ
            Isaac Sim basics & Hello World: Isaac Sim の基本と Hello World
            Robot Setup: ロボットの準備
            Import TurtleBot3 Lime: TurtleBot3 Lime のインポート
            Tune the robot: ロボットの調整
            Move it from Python: Python でロボットを動かす
            Your first Action Graph: はじめての Action Graph
            Drive with /cmd_vel: /cmd_vel で走らせる
            Odometry, TF & RViz: オドメトリ、TF、RViz
            Camera (RealSense D435): カメラ（RealSense D435）
            LiDAR & IMU: LiDAR と IMU
            Applications: 応用
            Object detection with YOLO: YOLO で物体検出
            Navigation with Nav2: Nav2 でナビゲーション
            Arm control with MoveIt 2: MoveIt 2 でアームを制御
            Pick and place: ピック＆プレース
            Make your own map with SLAM: SLAM で自分の地図を作る
            Behavior trees: ビヘイビアツリー
            "All together: tidy the room": 総仕上げ：部屋を片付ける
            Reference: リファレンス
            Troubleshooting: トラブルシューティング
            Credits & license: クレジットとライセンス

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
